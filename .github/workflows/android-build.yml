name: Build Android AAB and APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ Setup Node 20 FIRST before anything else
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ✅ Setup Java before installs
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Clean install
      - name: Install dependencies
        run: npm ci

      # ✅ Create env file to prevent Supabase init race conditions
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      # 🚀 ✅ Generate fresh android folder dynamically out of app.json config
      - name: Prebuild Native Android Folder
        run: npx expo prebuild --platform android --no-install

      # ✅ Decode keystore into the newly generated directory paths
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # ✅ Verify keystore exists
      - name: Verify keystore exists
        run: ls -la android/app/upload-keystore.jks

      # 📝 ✅ Auto-inject the release signing configurations into the generated build.gradle file
      - name: Inject Release Signing Configuration
        run: |
          node -e "
          const fs = require('fs');
          const filePath = 'android/app/build.gradle';
          let content = fs.readFileSync(filePath, 'utf8');
          
          const releaseSigningConfigs = \`
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('MYAPP_UPLOAD_STORE_PASSWORD')
                      keyAlias System.getenv('MYAPP_UPLOAD_KEY_ALIAS')
                      keyPassword System.getenv('MYAPP_UPLOAD_KEY_PASSWORD')
                  }
          \`;
          
          // Inject signing configs details directly into signingConfigs block
          content = content.replace('signingConfigs {', 'signingConfigs {' + releaseSigningConfigs);
          // Overwrite build types configuration to sign release builds using the release keystore profile
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release');
          
          fs.writeFileSync(filePath, content, 'utf8');
          "

      # ✅ Debug which Node Gradle will use (remove after confirming fix)
      - name: Debug Node path
        run: |
          which node
          node --version
          echo $PATH

      # ✅ Explicitly pass node binary so Gradle uses Node 20, not system default
      - name: Build AAB
        env:
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          NODE=$(which node)
          echo "Using node: $NODE ($($NODE --version))"
          ./gradlew bundleRelease \
            -Pnode.path=$NODE \
            --no-daemon \
            --stacktrace

      # ✅ Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # ✅ Build APK
      - name: Build APK
        env:
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          NODE=$(which node)
          ./gradlew assembleRelease \
            -Pnode.path=$NODE \
            --no-daemon \
            --stacktrace

      # ✅ Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk