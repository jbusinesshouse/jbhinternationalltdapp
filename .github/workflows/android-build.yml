name: Build Android AAB and APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ Setup Node 20 FIRST before anything else
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ✅ Setup Java before installs
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Clean install
      - name: Install dependencies
        run: npm ci

      # ✅ Create env file to prevent Supabase init race conditions
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      # 🚀 ✅ Generate fresh android folder dynamically out of app.json config
      - name: Prebuild Native Android Folder
        run: npx expo prebuild --platform android --no-install

      # ✅ Decode keystore into the newly generated directory paths
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks
          # Fail early if this is not the Play upload key
          FINGERPRINT=$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$MYAPP_UPLOAD_STORE_PASSWORD" | grep -m1 'SHA1:' | awk '{print $2}')
          echo "Keystore SHA1: $FINGERPRINT"
          test "$FINGERPRINT" = "82:77:BE:A8:16:A9:5E:D4:CD:39:19:FB:8C:6E:BC:94:7E:76:08:08"

      # 📝 ✅ Auto-inject the release signing configurations into the generated build.gradle file
      - name: Inject Release Signing Configuration
        run: node scripts/inject-release-signing.js


      # ✅ Debug which Node Gradle will use (remove after confirming fix)
      - name: Debug Node path
        run: |
          which node
          node --version
          echo $PATH

      # ✅ Explicitly pass node binary so Gradle uses Node 20, not system default
      - name: Build AAB
        env:
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          NODE=$(which node)
          echo "Using node: $NODE ($($NODE --version))"
          ./gradlew bundleRelease \
            -Pnode.path=$NODE \
            --no-daemon \
            --stacktrace

      # ✅ Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # ✅ Build APK
      - name: Build APK
        env:
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          NODE=$(which node)
          ./gradlew assembleRelease \
            -Pnode.path=$NODE \
            --no-daemon \
            --stacktrace

      # ✅ Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk